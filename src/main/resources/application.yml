spring:
  application:
    name: payment-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/payment_api}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}